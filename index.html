<!DOCTYPE html>
<html>
<head>
<title>Italy Flag</title>
<link rel="stylesheet" href="flag1.css">
<style>
    .flag{
    width:300px;
    height:200px;
    border:1px solid black;
}

.green{
    width:100px;
    height:200px;
    background-color:green;
    float:left;
}

.white{
    width:100px;
    height:200px;
    background-color:white;
    float:left;
}

.redish{
    width:100px;
    height:200px;
    background-color:red;
    float:left;
}
.ban{
    width:500px;
    height:300px;
    background:green;
    display:flex;
    justify-content:center;
    align-items:center;
}

.red{
    width:100px;
    height:100px;
    background:red;
    border-radius:50%;
}
.ukrain{
    width:500px;
    height:300px;
    display:flex;
    flex-direction:column;
}

.blue{
    width:500px;
    height:150px;
    background-color: rgb(119, 119, 231);
}

.yellow{
    width:500px;
    height:150px;
    background-color: yellow;
}
</style>
</head>
<body>
<h1>Italy Flag</h1>
<div class="flag">
    <div class="green"></div>
    <div class="white"></div>
    <div class="redish"></div>
</div><br><br>
    <h1>Bangladesh Flag</h1>
    <div class="ban">
        <div class="red"></div>
    </div><br><br>
    <h1>Ukraine</h1>
    <div class="ukrain">
        <div class="yellow"></div>
        <div class="blue"></div>
    </div>

</body>
</html>
